name: Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Promote to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download secret files
        shell: bash
        env:
          BITWARDEN_SERVER: ${{ secrets.BITWARDEN_CI_SERVER }}
          BITWARDEN_EMAIL: ${{ secrets.BITWARDEN_CI_EMAIL }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_CI_PASSWORD }}
          BITWARDEN_ITEM: ${{ secrets.BITWARDEN_CI_ITEM }}
        run: ./gradlew downloadBitwardenSecretFiles

      - name: Configure release credentials
        run: bash .github/scripts/configure-release-git.sh

      - name: Promotes the github release, promotes from the beta channel to production, updates the screenshots and open back-merge PR
        env:
          PLAY_STORE_CHANGES_NOT_SENT_FOR_REVIEW: ${{ vars.PLAY_STORE_CHANGES_NOT_SENT_FOR_REVIEW }}
        run: >
          ./gradlew
          assertVersionWasNotPushInProductionYet
          createGithubRelease
          publishToPlayStoreProductionRelease
          updatePlayStoreScreenshotsRelease
          openBackMergePullRequest
          -PplayStore.changesNotSentForReview="$PLAY_STORE_CHANGES_NOT_SENT_FOR_REVIEW"
          --stacktrace
