name: Start a new version branch

on:
  workflow_dispatch:
    inputs:
      flow:
        description: "Which kind of version ?"
        type: choice
        options:
          - release
          - hotfix
        required: true
      bump:
        description: "Version increment (release only - a hotfix always bumps patch)"
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor
      release-note:
        description: "Play Store release note for this version (use \n for line breaks, the UI field is single-line)"
        type: string
        required: true

concurrency:
  group: gitflow-${{ inputs.flow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    name: Cut a ${{ inputs.flow }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.flow == 'release' && 'develop' || 'main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.flow == 'release' && 'develop' || 'main' }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download secret files
        shell: bash
        env:
          BITWARDEN_SERVER: ${{ secrets.BITWARDEN_CI_SERVER }}
          BITWARDEN_EMAIL: ${{ secrets.BITWARDEN_CI_EMAIL }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_CI_PASSWORD }}
          BITWARDEN_ITEM: ${{ secrets.BITWARDEN_CI_ITEM }}
        run: ./gradlew downloadBitwardenSecretFiles

      - name: Use the release PAT for pushes
        shell: bash
        run: bash .github/scripts/configure-release-git.sh

      - name: Bump the version
        shell: bash
        env:
          BUMP: ${{ inputs.flow == 'hotfix' && 'patch' || inputs.bump }}
        run: |
          ./gradlew bumpVersion -Pversion.bump="$BUMP" --stacktrace

      - name: Write release notes
        shell: bash
        env:
          RELEASE_NOTE: ${{ inputs.release-note }}
        run: |
          ./gradlew writeReleaseNote -Pversion.releaseNote="$(printf '%b' "$RELEASE_NOTE")" --stacktrace

      - name: Run every gitflow assertion and cut the branch
        shell: bash
        env:
          FLOW: ${{ inputs.flow }}
        run: |
          if [ "$FLOW" = "release" ]; then
            cut_task=(createRelease)
          else
            cut_task=(createHotfix)
          fi
          ./gradlew "${cut_task[@]}" \
            commitAddedFiles -Pgitflow.gitflowBranchCommitMessage="Version bump" \
            pushGitflowBranch \
            --stacktrace
