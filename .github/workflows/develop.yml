name: Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build everything, test and report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Uses the latest commit from the branch when running a pull request instead of compiling a merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run buildSrc unit tests
        run: ./gradlew -p buildSrc test --stacktrace

      - name: Analyse code, build and test everything
        run: >
          ./gradlew
          build
          verifyPaparazzi
          pixel2api34DebugAndroidTest
          copyScreenshot
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          --scan
          --stacktrace

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          files: "**/build/test-results/**/*.xml"

      - name: Lint reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Lint-reports
          path: "**/build/reports/lint-*.html"

      - name: Detekt reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Detekt-reports
          path: "**/build/reports/detekt/*.html"

      - name: Paparazzi failures screens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: Paparazzi-failures
          path: "**/build/paparazzi/failures/**/*.png"

      - name: Instrumented tests reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Instrumented-reports
          path: "**/build/reports/androidTests/**/*.html"

      - name: Screenshots report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Screenshots-reports
          path: "**/graphics/phone-screenshots/*.png"

      - name: APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: APKs
          path: "**/build/outputs/apk/**/*.apk"

      - name: Configuration cache reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Configuration-cache-report
          path: "build/reports/configuration-cache/*/*/configuration-cache-report.html"

      - name: Resources monitor report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Resource-monitor-report
          path: "build/reports/resources/*.csv"
